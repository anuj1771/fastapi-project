<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Job - AffeeSo</title>
</head>
<body class="affeeso-body">
  {% include 'partials/site_header.html' %}
  <main class="affeeso-main">
    <div class="affeeso-container">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
        <h1 class="affeeso-page-title" style="margin:0;">Create a job</h1>
        <a href="/dashboard" class="affeeso-btn affeeso-btn-outline">Dashboard</a>
      </div>

    {% if success %}
      <div class="affeeso-alert affeeso-alert-success">{{ success }}</div>
    {% endif %}
    {% if error %}
      <div class="affeeso-alert affeeso-alert-error">{{ error }}</div>
    {% endif %}

    <section class="affeeso-card">
      <form action="/ui/jobs/create" method="post" class="space-y-4 js-paid-action" data-cost="{{ coin_costs.create_job_cost or 0 }}" data-action-label="Create Job">
        <input class="w-full border rounded p-2" name="title" type="text" placeholder="Campaign title (e.g. Summer Collection Push)" required />
        <textarea class="w-full border rounded p-2 min-h-24" name="promotion_requirement" placeholder="What promotion do you want? Include deliverables and campaign goal." required></textarea>
        <input class="w-full border rounded p-2" name="budget" type="text" placeholder="Budget (e.g. INR 20,000 - 30,000)" required />
        <textarea class="w-full border rounded p-2 min-h-24" name="target_instagram_profiles" placeholder="What kind of Instagram profiles do you want (niche, followers range, location, audience)?" required></textarea>
        <input class="w-full border rounded p-2" name="promotion_tags" type="text" placeholder="Tags: story promotion, reel, image post, collaboration" required />
        <input class="w-full border rounded p-2" name="profile_image_url" type="url" placeholder="Optional brand profile image URL" />
        <button type="submit" class="affeeso-btn affeeso-btn-primary" style="width:100%;padding:12px;">Post job</button>
      </form>
      <p class="text-xs text-gray-500 mt-3">Use clear tags like story promotion, reel, image post, collaboration so advertisers can quickly match.</p>
    </section>
    </div>
  </main>
  <div id="coinModal" class="fixed inset-0 hidden items-center justify-center bg-slate-900/50 px-4">
    <div class="w-full max-w-md rounded-xl bg-white shadow-xl border border-slate-200">
      <div class="px-6 pt-6 pb-3 text-center">
        <h3 id="coinModalTitle" class="text-lg font-semibold text-slate-900">Popup title</h3>
        <p id="coinModalText" class="mt-2 text-sm text-slate-600">This action will cost coins.</p>
      </div>
      <div class="px-6 pb-6 flex gap-3 justify-center">
        <button id="coinModalCancel" type="button" class="w-32 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Close</button>
        <button id="coinModalOk" type="button" class="w-32 rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Ok</button>
      </div>
    </div>
  </div>
  <script>
    const coinModal = document.getElementById("coinModal");
    const coinModalTitle = document.getElementById("coinModalTitle");
    const coinModalText = document.getElementById("coinModalText");
    const coinModalCancel = document.getElementById("coinModalCancel");
    const coinModalOk = document.getElementById("coinModalOk");

    function openCoinModal({ title, text, onOk }) {
      coinModalTitle.textContent = title || "Confirm";
      coinModalText.textContent = text || "";
      coinModal.classList.remove("hidden");
      coinModal.classList.add("flex");

      const cleanup = () => {
        coinModal.classList.add("hidden");
        coinModal.classList.remove("flex");
        coinModalOk.onclick = null;
        coinModalCancel.onclick = null;
      };

      coinModalCancel.onclick = () => cleanup();
      coinModalOk.onclick = () => {
        cleanup();
        onOk && onOk();
      };
    }

    document.querySelectorAll(".js-paid-action").forEach((form) => {
      form.addEventListener("submit", (e) => {
        const cost = Number(form.dataset.cost || "0");
        if (!Number.isFinite(cost) || cost <= 0) return;
        e.preventDefault();
        const label = form.dataset.actionLabel || "This action";
        openCoinModal({
          title: "Popup title",
          text: `${label} will cost ${cost} coins. Do you want to continue?`,
          onOk: () => form.submit(),
        });
      });
    });
  </script>
</body>
</html>
